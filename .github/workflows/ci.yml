name: ci

on:
  push:
    branches:
      - main
      - '*-gate'
  pull_request:

# Needed only by the final step, which records the verdict as a ref.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run validate

      - run: npm run check

      - run: npm run build

      # Branded Chrome, because the card player is only tested when its AAC
      # clips actually decode and end; see playwright.config.ts. It installs
      # as a system package rather than into ~/.cache/ms-playwright, so
      # there is nothing here left worth caching.
      - name: Install the Playwright browser
        run: npx playwright install chrome --with-deps

      - run: npm test

      # A deployment gate reads this ref: its existence is the statement
      # that this exact commit passed every check above.
      - name: Record the green verdict for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin "HEAD:refs/ci-green/${GITHUB_SHA}"
